<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <h1>Login</h1>
    <form action="#" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="login-password">Password:</label>
        <input type="password" id="login-password" name="password" required>
        <br><br>

        <!-- A CSRF token helps a server verify that a submitted request came from its legitimate form, reducing cross-site request forgery risks. A real token must be generated and validated by the server. -->
        <input type="hidden" name="csrf_token" value="dummy-csrf-token-12345">

        <button type="submit">Login</button>
    </form>
</body>
</html>
