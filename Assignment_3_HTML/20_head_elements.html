<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The title appears in the browser tab and is used by search engines. -->
    <title>Important HTML Head Elements</title>

    <!-- charset sets the character encoding so text displays correctly. -->
    <meta charset="UTF-8">

    <!-- description provides a short summary of the webpage. -->
    <meta name="description" content="A demonstration of important HTML head elements.">

    <!-- author identifies the creator of the webpage. -->
    <meta name="author" content="Naman">

    <!-- base sets the base URL used by relative links on this page. -->
    <base href="https://example.com/">

    <!-- link connects an external resource; this example links to a favicon. -->
    <link rel="icon" href="https://example.com/favicon.ico" type="image/x-icon">

    <!-- style contains CSS rules; it is empty because this assignment uses HTML only. -->
    <style>
    </style>

    <!-- script can contain or link JavaScript; it is empty because this assignment uses HTML only. -->
    <script>
    </script>
</head>
<body>
    <h1>Important Head Elements</h1>
    <p>This page demonstrates the title, meta, base, link, style, and script elements inside the head section.</p>
    <a href="about">Example relative link using the base URL</a>
</body>
</html>
