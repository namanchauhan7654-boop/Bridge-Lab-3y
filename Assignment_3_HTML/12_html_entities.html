<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <h1>HTML Entities Demonstration</h1>
    <p>
        Less than: &lt; |
        Greater than: &gt; |
        Ampersand: &amp; |
        Double quote: &quot; |
        Apostrophe: &apos;
    </p>
    <p>
        Copyright: &copy; |
        Trademark: &trade; |
        Registered: &reg;
    </p>
</body>
</html>
