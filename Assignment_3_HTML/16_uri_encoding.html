<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Demonstration</h1>

    <p>Example of a URL containing a space and a reserved ampersand:</p>
    <p>Original text: https://example.com/search?query=HTML &amp; CSS</p>

    <p>Encoded URL (space becomes %20 and the ampersand inside the query value becomes %26):</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        https://example.com/search?query=HTML%20%26%20CSS
    </a>
</body>
</html>
