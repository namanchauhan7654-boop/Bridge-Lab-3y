<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form Demonstration</title>
</head>
<body>
    <h1>Payment Form (Demo Only)</h1>
    <p>This is an HTML practice form. Do not enter or submit real payment details.</p>

    <form action="#" method="post">
        <label for="cardholder">Cardholder Name:</label>
        <input type="text" id="cardholder" name="cardholder_name" required>
        <br><br>

        <label for="card-number">Card Number:</label>
        <input type="text" id="card-number" name="card_number" inputmode="numeric" required>
        <br><br>

        <label for="expiry">Expiry Date:</label>
        <input type="text" id="expiry" name="expiry_date" placeholder="MM/YY" required>
        <br><br>

        <label for="cvv">CVV:</label>
        <input type="password" id="cvv" name="cvv" required>
        <br><br>

        <button type="submit">Pay Now</button>
    </form>
</body>
</html>
