<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map - Mathura</title>
</head>
<body>
    <h1>Map of Mathura</h1>

    <!-- loading="lazy" delays loading the map until it is near the visible area, which can save data and improve initial page loading. -->
    <iframe
        src="https://www.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
