<!DOCTYPE html>
<html lang="en">
<head>

    <title>YouTube Video</title>
</head>
<body>
    <h1>Embedded YouTube Video</h1>

    <!-- The iframe embeds a YouTube video. Percentage dimensions adapt to the browser width. -->

        title="Sample YouTube video"
        width="80%"
        height="450px"
        allowfullscreen>

</body>
