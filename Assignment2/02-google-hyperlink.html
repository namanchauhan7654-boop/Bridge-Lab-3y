<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Hyperlink</title>
</head>
<body>
    <!-- The target attribute opens the link in a new tab. -->
    <p>Visit <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">Google Search</a> to search the web.</p>
</body>
</html>
