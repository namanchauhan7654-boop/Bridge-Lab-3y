<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="06_photo_gallery.css">
</head>
<body>
    <main class="gallery-page">
        <header>
            <h1>Moments in Nature</h1>
            <p>A small collection of beautiful places</p>
        </header>
        <section class="gallery" aria-label="Photo gallery">
            <figure><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=900" alt="Sunrise over a green landscape"><figcaption>Golden Sunrise</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900" alt="Mountain landscape"><figcaption>Mountain Escape</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900" alt="Lake surrounded by mountains"><figcaption>Quiet Lake</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900" alt="Sunlight in a forest"><figcaption>Forest Path</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=900" alt="Mountain valley and lake"><figcaption>Open Valley</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=900" alt="Green meadow under the sky"><figcaption>Green Meadow</figcaption></figure>
        </section>
    </main>
</body>
</html>
