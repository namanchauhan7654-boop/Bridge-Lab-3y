<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5: Styled Button Collection</title>
    <link rel="stylesheet" href="q5_button_collection.css">
</head>
<body>
    <header class="header">
        <h1>UI Button Design System</h1>
        <p>Inspect hover, active press, keyboard <code>:focus</code> rings, and <code>:disabled</code> states.</p>
    </header>

    <main class="stage">
        <section class="button-panel" aria-label="Button Variants">
            <h2>Interactive Button States</h2>
            <p class="hint">Try clicking, holding down, or pressing <kbd>Tab</kbd> across the buttons below:</p>

            <!-- Flexbox Button Group -->
            <div class="button-row">
                <button type="button" class="btn btn-primary">Primary Action</button>
                <button type="button" class="btn btn-secondary">Secondary Action</button>
                <button type="button" class="btn btn-outline">Outline Button</button>
                <button type="button" class="btn btn-disabled" disabled>Disabled Button</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Assignment 8 &bull; Question 5: Styled Button Collection</p>
    </footer>
</body>
</html>
