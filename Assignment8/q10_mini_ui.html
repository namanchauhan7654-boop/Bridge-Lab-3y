<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q10: Complete Mini User Interface Layout</title>
    <link rel="stylesheet" href="q10_mini_ui.css">
</head>
<body>
    <!-- Compact Semantic Header -->
    <header class="mini-header">
        <div class="header-inner">
            <span class="logo">PulseUI</span>
            <span class="tagline">Member Quick-Checkin Portal</span>
        </div>
    </header>

    <!-- Main Centered Content Card -->
    <main class="mini-main">
        <section class="profile-ui-card" aria-labelledby="card-title">
            <!-- Small Avatar / Feature Image -->
            <div class="card-media">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><defs><linearGradient id='av' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%232563eb'/><stop offset='100%' stop-color='%2306b6d4'/></linearGradient></defs><rect width='120' height='120' rx='60' fill='url(%23av)'/><circle cx='60' cy='46' r='20' fill='%23ffffff'/><path d='M26,102 C26,78 94,78 94,102' fill='%23ffffff'/></svg>" alt="Member profile avatar" class="profile-img">
                <div>
                    <h1 id="card-title">Workspace Access</h1>
                    <p class="card-sub">Sign in to sync your daily project tasks.</p>
                </div>
            </div>

            <!-- Compact Form -->
            <form class="mini-form" action="#" method="post">
                <div class="field-group">
                    <label for="member-email">Work Email</label>
                    <input type="email" id="member-email" placeholder="alex@company.com" required>
                </div>

                <div class="field-group">
                    <label for="member-role">Team Department</label>
                    <input type="text" id="member-role" placeholder="Frontend Engineering" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Continue</button>
                    <button type="reset" class="btn-clear">Clear</button>
                </div>
            </form>
        </section>
    </main>

    <!-- Compact Semantic Footer -->
    <footer class="mini-footer">
        <p>&copy; 2026 PulseUI &bull; Assignment 8, Question 10</p>
    </footer>
</body>
</html>
