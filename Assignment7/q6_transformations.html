<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6: CSS Transformations Showcase</title>
    <link rel="stylesheet" href="q6_transformations.css">
</head>
<body>
    <header class="header">
        <h1>2D CSS Transformations Showcase</h1>
        <p>Hover over each box below to trigger smooth CSS <code>transform</code> animations.</p>
    </header>

    <main class="main-stage">
        <!-- Horizontal Flexbox Row -->
        <section class="transform-row" aria-label="CSS Transform Examples">
            <!-- 1. Rotate -->
            <figure class="transform-item">
                <div class="transform-box box-rotate">Rotate</div>
                <figcaption><code>transform: rotate(25deg);</code></figcaption>
            </figure>

            <!-- 2. Scale -->
            <figure class="transform-item">
                <div class="transform-box box-scale">Scale</div>
                <figcaption><code>transform: scale(1.2);</code></figcaption>
            </figure>

            <!-- 3. Translate -->
            <figure class="transform-item">
                <div class="transform-box box-translate">Translate</div>
                <figcaption><code>transform: translate(12px, -16px);</code></figcaption>
            </figure>

            <!-- 4. Skew -->
            <figure class="transform-item">
                <div class="transform-box box-skew">Skew</div>
                <figcaption><code>transform: skew(15deg, 8deg);</code></figcaption>
            </figure>
        </section>
    </main>

    <footer class="footer">
        <p>Assignment 7 &bull; Question 6: CSS 2D Transformations</p>
    </footer>
</body>
</html>
