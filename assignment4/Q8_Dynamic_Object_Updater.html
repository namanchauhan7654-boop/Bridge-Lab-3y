<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q8 - Dynamic Object Updater</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #17a2b8; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 8px; }
    #preview { margin-top: 25px; background: #e9f7fb; padding: 18px; border-radius: 8px; }
    pre { margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Dynamic Object Updater</h2>
  <p>Edit the values below and click Update to change the user object in real time.</p>

  <form id="userForm">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" value="John">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" value="john@mail.com">
    </div>
    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age" value="21">
    </div>
    <button type="submit">Update Object</button>
  </form>

  <div id="preview">
    <h3>Current User Object</h3>
    <pre id="objectDisplay"></pre>
  </div>

  <script>
    "use strict";
    // Q8: Dynamic Object Updater

    // Initial user object
    let user = {
      name: "John",
      email: "john@mail.com",
      age: 21
    };

    const form = document.getElementById("userForm");
    const display = document.getElementById("objectDisplay");

    // Show initial object
    function renderUser() {
      display.textContent = JSON.stringify(user, null, 2);
    }
    renderUser();

    // On submit → update the user object in real time
    form.addEventListener("submit", function (e) {
      e.preventDefault();

      // Update object properties from form values
      user.name = document.getElementById("name").value.trim();
      user.email = document.getElementById("email").value.trim();
      user.age = Number(document.getElementById("age").value);

      // Show updated object details below the form using DOM
      renderUser();
      console.log("Updated user object:", user);
    });
  </script>
</body>
</html>
