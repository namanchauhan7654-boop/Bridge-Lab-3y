<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q2 - Student Form Validator</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 2px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    input.valid { border-color: #28a745; background: #f0fff4; }
    input.invalid { border-color: #dc3545; background: #fff5f5; }
    .error { color: #dc3545; font-size: 13px; margin-top: 4px; display: none; }
    button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; width: 100%; }
    button:hover { background: #0056b3; }
    #result { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <h2>Student Registration Form</h2>
  <form id="studentForm" novalidate>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Only alphabets">
      <div class="error" id="nameError">Name must contain only alphabets</div>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@domain.com">
      <div class="error" id="emailError">Enter a valid email (example@domain.com)</div>
    </div>
    <div class="form-group">
      <label for="phone">Phone</label>
      <input type="text" id="phone" placeholder="10 digits only">
      <div class="error" id="phoneError">Phone must be exactly 10 digits</div>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Uppercase + number + special char">
      <div class="error" id="passwordError">Must contain 1 uppercase, 1 number & 1 special character</div>
    </div>
    <button type="submit">Register</button>
  </form>
  <div id="result"></div>

  <script>
    "use strict";
    // Q2: Student Form Validator (Forms + RegExp)

    const form = document.getElementById("studentForm");
    const resultDiv = document.getElementById("result");

    // Regular Expressions
    const nameRegex = /^[A-Za-z\s]+$/;                    // only alphabets (and spaces)
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;      // basic valid email
    const phoneRegex = /^\d{10}$/;                        // exactly 10 digits
    const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).+$/; // 1 upper, 1 number, 1 special

    function setValid(input, errorId) {
      input.classList.remove("invalid");
      input.classList.add("valid");
      document.getElementById(errorId).style.display = "none";
    }

    function setInvalid(input, errorId) {
      input.classList.remove("valid");
      input.classList.add("invalid");
      document.getElementById(errorId).style.display = "block";
    }

    function validateField(input, regex, errorId) {
      if (regex.test(input.value.trim())) {
        setValid(input, errorId);
        return true;
      } else {
        setInvalid(input, errorId);
        return false;
      }
    }

    // Live validation on input
    document.getElementById("name").addEventListener("input", function () {
      validateField(this, nameRegex, "nameError");
    });
    document.getElementById("email").addEventListener("input", function () {
      validateField(this, emailRegex, "emailError");
    });
    document.getElementById("phone").addEventListener("input", function () {
      validateField(this, phoneRegex, "phoneError");
    });
    document.getElementById("password").addEventListener("input", function () {
      validateField(this, passwordRegex, "passwordError");
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const nameOk = validateField(document.getElementById("name"), nameRegex, "nameError");
      const emailOk = validateField(document.getElementById("email"), emailRegex, "emailError");
      const phoneOk = validateField(document.getElementById("phone"), phoneRegex, "phoneError");
      const passOk = validateField(document.getElementById("password"), passwordRegex, "passwordError");

      if (nameOk && emailOk && phoneOk && passOk) {
        resultDiv.style.display = "block";
        resultDiv.style.background = "#d4edda";
        resultDiv.style.color = "#155724";
        resultDiv.textContent = "✓ All fields valid! Registration successful.";
        console.log("Form submitted successfully");
      } else {
        resultDiv.style.display = "block";
        resultDiv.style.background = "#f8d7da";
        resultDiv.style.color = "#721c24";
        resultDiv.textContent = "✗ Please fix the highlighted errors.";
      }
    });
  </script>
</body>
</html>
