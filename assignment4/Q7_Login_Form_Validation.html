<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q7 - Login Form Validation</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 11px; border: 2px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    input.valid { border-color: #28a745; }
    input.invalid { border-color: #dc3545; }
    .error { color: #dc3545; font-size: 13px; margin-top: 4px; display: none; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    #message { margin-top: 20px; padding: 14px; border-radius: 6px; text-align: center; display: none; }
  </style>
</head>
<body>
  <h2>Login Form</h2>
  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="At least 5 characters">
      <div class="error" id="usernameError">Username must be at least 5 characters</div>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="8+ chars, upper, lower, number, special">
      <div class="error" id="passwordError">Password must be ≥8 chars and include uppercase, lowercase, number & special character</div>
    </div>
    <button type="submit">Login</button>
  </form>
  <div id="message"></div>

  <script>
    "use strict";
    // Q7: Login Form Validation using RegExp

    // Username: at least 5 characters
    const usernameRegex = /^.{5,}$/;

    // Password: at least 8 characters, must include number, uppercase, lowercase, special character
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;

    const form = document.getElementById("loginForm");
    const messageDiv = document.getElementById("message");

    function showError(input, errorId, show) {
      if (show) {
        input.classList.add("invalid");
        input.classList.remove("valid");
        document.getElementById(errorId).style.display = "block";
      } else {
        input.classList.remove("invalid");
        input.classList.add("valid");
        document.getElementById(errorId).style.display = "none";
      }
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      let isValid = true;
      let specificErrors = [];

      // Validate username
      if (!usernameRegex.test(username)) {
        showError(usernameInput, "usernameError", true);
        specificErrors.push("Username must be at least 5 characters");
        isValid = false;
      } else {
        showError(usernameInput, "usernameError", false);
      }

      // Validate password with more specific feedback
      if (!passwordRegex.test(password)) {
        showError(passwordInput, "passwordError", true);
        if (password.length < 8) specificErrors.push("Password too short (min 8 characters)");
        if (!/[A-Z]/.test(password)) specificErrors.push("Missing uppercase letter");
        if (!/[a-z]/.test(password)) specificErrors.push("Missing lowercase letter");
        if (!/\d/.test(password)) specificErrors.push("Missing number");
        if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) specificErrors.push("Missing special character");
        isValid = false;
      } else {
        showError(passwordInput, "passwordError", false);
      }

      messageDiv.style.display = "block";
      if (isValid) {
        messageDiv.style.background = "#d4edda";
        messageDiv.style.color = "#155724";
        messageDiv.textContent = "✓ Login successful! Welcome back.";
        console.log("Login credentials valid");
      } else {
        messageDiv.style.background = "#f8d7da";
        messageDiv.style.color = "#721c24";
        messageDiv.innerHTML = "✗ Validation failed:<br>" + specificErrors.map(e => "• " + e).join("<br>");
      }
    });
  </script>
</body>
</html>
