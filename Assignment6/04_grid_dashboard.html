<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Dashboard</title>
    <link rel="stylesheet" href="04_grid_dashboard.css">
</head>
<body>
    <div class="dashboard">
        <header class="topbar"><h1>Admin Dashboard</h1><p>Welcome back</p></header>
        <aside class="sidebar">
            <nav aria-label="Dashboard navigation">
                <a href="#overview">Overview</a>
                <a href="#analytics">Analytics</a>
                <a href="#reports">Reports</a>
                <a href="#settings">Settings</a>
            </nav>
        </aside>
        <main class="main" id="overview">
            <article class="box wide"><h2>Overview</h2><p>Your dashboard summary and latest activity appear here.</p></article>
            <article class="box" id="analytics"><h2>Analytics</h2><p>Review performance and trends.</p></article>
            <article class="box" id="reports"><h2>Reports</h2><p>View your recent reports.</p></article>
            <article class="box" id="settings"><h2>Settings</h2><p>Manage your preferences.</p></article>
        </main>
    </div>
</body>
</html>
