<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>
    <link rel="stylesheet" href="08_photo_gallery_grid.css">
</head>
<body>
    <main class="gallery-page">
        <header><h1>Explore the Outdoors</h1><p>A responsive collection of landscapes</p></header>
        <section class="gallery" aria-label="Landscape photographs">
            <figure><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800" alt="Sunrise over a meadow"><figcaption>Sunrise Meadow</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800" alt="Mountain range"><figcaption>Mountain View</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Lake and mountains"><figcaption>Still Waters</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Green forest"><figcaption>Forest Trail</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800" alt="Mountain lake valley"><figcaption>Alpine Valley</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800" alt="Green field"><figcaption>Open Fields</figcaption></figure>
        </section>
    </main>
</body>
</html>
