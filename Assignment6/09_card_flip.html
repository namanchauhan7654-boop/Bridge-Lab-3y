<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Flip</title>
    <link rel="stylesheet" href="09_card_flip.css">
</head>
<body>
    <main class="page">
        <h1>Discover the Mountains</h1>
        <div class="scene">
            <article class="flip-card">
                <div class="card-inner">
                    <section class="card-face card-front">
                        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900" alt="Mountain landscape">
                        <h2>Mountain Adventure</h2>
                        <p>Hover to discover more</p>
                    </section>
                    <section class="card-face card-back">
                        <h2>Explore Nature</h2>
                        <p>Mountain journeys offer fresh air, beautiful views, and a chance to reconnect with nature. Plan carefully and respect the environment.</p>
                    </section>
                </div>
            </article>
        </div>
    </main>
</body>
</html>
