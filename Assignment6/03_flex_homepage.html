<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Homepage</title>
    <link rel="stylesheet" href="03_flex_homepage.css">
</head>
<body>
    <header>
        <h1>My Website</h1>
        <nav aria-label="Main navigation">
            <a href="#services">Services</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section class="boxes">
            <article class="box" id="services"><h2>Services</h2><p>We provide creative and useful digital services.</p></article>
            <article class="box" id="projects"><h2>Projects</h2><p>Explore ideas and projects built with care.</p></article>
            <article class="box" id="contact"><h2>Contact</h2><p>Get in touch to discuss a new idea.</p></article>
        </section>
    </main>
    <footer><p>© 2026 My Website</p></footer>
</body>
</html>
