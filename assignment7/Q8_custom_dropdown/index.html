<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Custom Dropdown</h1>
        <div class="dropdown" id="dropdown">
            <button id="dropdownButton" aria-expanded="false">Choose a course</button>
            <ul id="dropdownOptions" hidden>
                <li><button type="button">JavaScript</button></li>
                <li><button type="button">Python</button></li>
                <li><button type="button">Java</button></li>
                <li><button type="button">C++</button></li>
            </ul>
        </div>
    </main>
</body>
</html>
