<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-theme="light">
    <main class="panel">
        <h1>Theme Switcher</h1>
        <p>Select a theme to change the page appearance.</p>
        <div class="buttons">
            <button data-theme-choice="light">Light</button>
            <button data-theme-choice="dark">Dark</button>
            <button data-theme-choice="blue">Blue</button>
        </div>
        <p>Current theme: <strong id="currentTheme">Light</strong></p>
    </main>
</body>
</html>
