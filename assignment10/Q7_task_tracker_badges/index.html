<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow | My Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <header class="bg-white border-bottom py-4"><div class="container d-flex justify-content-between align-items-center"><h1 class="h3 fw-bold mb-0">TaskFlow</h1><span class="badge text-bg-primary fs-6">3 pending</span></div></header>
  <main class="container py-5">
    <div class="row justify-content-center"><section class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h4 mb-0">Today's tasks</h2><span class="text-secondary small">Wednesday · 18 November</span></div>
      <ul class="list-group shadow-sm">
        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2"><div><strong>Finalize project presentation</strong><div class="small text-secondary">Due today · 11:00 AM</div></div><span class="badge text-bg-danger rounded-pill">High</span></li>
        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2"><div><strong>Review Bootstrap components</strong><div class="small text-secondary">Due today · 2:00 PM</div></div><span class="badge text-bg-warning rounded-pill">Medium</span></li>
        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2"><div><strong>Organize project resources</strong><div class="small text-secondary">Due tomorrow</div></div><span class="badge text-bg-success rounded-pill">Low</span></li>
      </ul>
      <div class="text-end mt-4"><button class="btn btn-outline-success" type="button">Completed <span class="badge text-bg-success ms-1">5</span></button></div>
    </section></div>
  </main>
  <footer class="text-center text-secondary py-3"><small>TaskFlow · Make progress one task at a time.</small></footer>
</body>
</html>
