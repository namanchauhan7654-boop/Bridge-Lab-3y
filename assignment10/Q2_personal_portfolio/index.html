<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex Morgan | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">
  <header class="bg-white shadow-sm py-4">
    <div class="container text-center">
      <h1 class="fw-bold mb-1">Alex Morgan</h1>
      <p class="text-secondary mb-0">Frontend Developer · UI Enthusiast · Lifelong Learner</p>
    </div>
  </header>
  <main class="container py-5">
    <section class="row justify-content-center text-center">
      <div class="col-lg-8">
        <img class="profile-img img-fluid rounded-circle mt-4 mb-3" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80" alt="Portrait of Alex Morgan">
        <h2 class="fw-bold">Hello, I'm Alex</h2>
        <p class="lead">I build accessible, responsive websites that make digital experiences feel effortless.</p>
        <div class="d-flex flex-wrap justify-content-center gap-3 mt-4 mb-3">
          <a href="mailto:alex@example.com" class="btn btn-primary">Hire Me</a>
          <a href="#" class="btn btn-outline-dark">Download CV</a>
        </div>
      </div>
    </section>
    <section class="row justify-content-center mt-4">
      <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm p-4">
          <h3 class="h4 text-center fw-bold mb-3">Get in touch</h3>
          <form>
            <label for="email" class="form-label">Email address</label>
            <input id="email" type="email" class="form-control mb-3" placeholder="you@example.com">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control mb-3" rows="3" placeholder="Tell me about your project"></textarea>
            <button class="btn btn-dark w-100" type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer class="text-center py-4 text-secondary"><small>© 2026 Alex Morgan · alex@example.com</small></footer>
</body>
</html>
