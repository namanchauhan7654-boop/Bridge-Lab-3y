<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
    <header class="header">
        <h1>Before &amp; After Image Filter Comparison</h1>
        <p>Hover over the right-hand filtered image to fade the CSS filter away smoothly.</p>
    </header>

    <main class="container">
        <section class="compare-wrapper" aria-label="Before and after image comparison">
            <!-- Left Image: Original -->
            <figure class="compare-card">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='640' height='420'><defs><linearGradient id='cmp' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%230284c7'/><stop offset='55%' stop-color='%23f59e0b'/><stop offset='100%' stop-color='%23be123c'/></linearGradient></defs><rect width='640' height='420' fill='url(%23cmp)'/><circle cx='460' cy='125' r='55' fill='%23fef08a'/><polygon points='0,420 210,180 420,420' fill='%231e293b' opacity='0.75'/><polygon points='260,420 470,150 640,420' fill='%230f172a' opacity='0.85'/></svg>" alt="Original unfiltered mountain landscape">
                <figcaption><strong>Before:</strong> Original Unfiltered Image</figcaption>
            </figure>

            <!-- Right Image: Filtered (fades on hover) -->
            <figure class="compare-card">
                <img class="filtered-target" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='640' height='420'><defs><linearGradient id='cmp2' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%230284c7'/><stop offset='55%' stop-color='%23f59e0b'/><stop offset='100%' stop-color='%23be123c'/></linearGradient></defs><rect width='640' height='420' fill='url(%23cmp2)'/><circle cx='460' cy='125' r='55' fill='%23fef08a'/><polygon points='0,420 210,180 420,420' fill='%231e293b' opacity='0.75'/><polygon points='260,420 470,150 640,420' fill='%230f172a' opacity='0.85'/></svg>" alt="Filtered mountain landscape with high contrast and grayscale">
                <figcaption><strong>After:</strong> <code>contrast(185%) brightness(75%) grayscale(80%)</code> (Hover to reveal)</figcaption>
            </figure>
        </section>
    </main>

    <footer class="footer">
        <p>Assignment 9 &bull; Filter Comparison Layout</p>
    </footer>
</body>
</html>
