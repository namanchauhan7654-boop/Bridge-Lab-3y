<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <!-- Semantic Header -->
    <header class="site-header">
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over any card to smoothly remove its CSS filter and reveal the original colors.</p>
    </header>

    <!-- Main Gallery Container -->
    <main class="gallery-wrapper">
        <section class="filter-grid" aria-label="CSS Filter Image Gallery">
            <figure class="filter-card">
                <div class="img-container">
                    <img class="filter-blur" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'><defs><linearGradient id='s1' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%231d4ed8'/><stop offset='100%' stop-color='%2338bdf8'/></linearGradient></defs><rect width='600' height='400' fill='url(%23s1)'/><polygon points='0,400 180,150 370,400' fill='%230f172a' opacity='0.6'/><polygon points='240,400 430,110 600,400' fill='%231e293b' opacity='0.8'/></svg>" alt="Blue mountain peaks">
                </div>
                <figcaption>1. <code>filter: blur(3px);</code></figcaption>
            </figure>

            <figure class="filter-card">
                <div class="img-container">
                    <img class="filter-grayscale" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'><defs><linearGradient id='s2' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='%23f59e0b'/><stop offset='100%' stop-color='%23dc2626'/></linearGradient></defs><rect width='600' height='400' fill='url(%23s2)'/><circle cx='300' cy='210' r='80' fill='%23fef08a'/><rect y='275' width='600' height='125' fill='%23451a03' opacity='0.75'/></svg>" alt="Golden sunset over dunes">
                </div>
                <figcaption>2. <code>filter: grayscale(100%);</code></figcaption>
            </figure>

            <figure class="filter-card">
                <div class="img-container">
                    <img class="filter-sepia" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'><defs><linearGradient id='s3' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%23047857'/><stop offset='100%' stop-color='%2334d399'/></linearGradient></defs><rect width='600' height='400' fill='url(%23s3)'/><circle cx='170' cy='310' r='135' fill='%23064e3b' opacity='0.7'/><circle cx='440' cy='315' r='155' fill='%23022c22' opacity='0.8'/></svg>" alt="Lush emerald forest canopy">
                </div>
                <figcaption>3. <code>filter: sepia(90%);</code></figcaption>
            </figure>

            <figure class="filter-card">
                <div class="img-container">
                    <img class="filter-brightness" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'><defs><linearGradient id='s4' x1='0' y1='0' x2='1' y2='0'><stop offset='0%' stop-color='%234338ca'/><stop offset='100%' stop-color='%23ec4899'/></linearGradient></defs><rect width='600' height='400' fill='url(%23s4)'/><rect x='90' y='120' width='90' height='280' fill='%231e1b4b'/><rect x='230' y='75' width='115' height='325' fill='%230f172a'/><rect x='385' y='145' width='115' height='255' fill='%231e1b4b'/></svg>" alt="Neon twilight city towers">
                </div>
                <figcaption>4. <code>filter: brightness(55%);</code></figcaption>
            </figure>

            <figure class="filter-card">
                <div class="img-container">
                    <img class="filter-contrast" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'><defs><linearGradient id='s5' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='%230284c7'/><stop offset='100%' stop-color='%2314b8a6'/></linearGradient></defs><rect width='600' height='400' fill='url(%23s5)'/><path d='M0,255 Q150,200 300,255 T600,255 L600,400 L0,400 Z' fill='%23e0f2fe' opacity='0.45'/></svg>" alt="Ocean waves under clear sky">
                </div>
                <figcaption>5. <code>filter: contrast(210%);</code></figcaption>
            </figure>

            <figure class="filter-card">
                <div class="img-container">
                    <img class="filter-hue" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'><defs><linearGradient id='s6' x1='0' y1='1' x2='1' y2='0'><stop offset='0%' stop-color='%23be123c'/><stop offset='100%' stop-color='%23fb923c'/></linearGradient></defs><rect width='600' height='400' fill='url(%23s6)'/><polygon points='300,60 520,340 80,340' fill='%23fff1f2' opacity='0.3'/></svg>" alt="Geometric pyramid artwork">
                </div>
                <figcaption>6. <code>filter: hue-rotate(150deg);</code></figcaption>
            </figure>
        </section>
    </main>

    <!-- Semantic Footer -->
    <footer class="site-footer">
        <p>Assignment 9 &bull; Responsive Image Filter Gallery</p>
    </footer>
</body>
</html>
