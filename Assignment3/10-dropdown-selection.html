<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection Page</title>
</head>
<body>
    <h1>Travel Preference Selection</h1>

    <!-- Each select element has a pre-selected option. -->
    <form action="#" method="get">
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option selected>India</option>
            <option>Canada</option>
            <option>Japan</option>
        </select>
        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option selected>Uttar Pradesh</option>
            <option>Rajasthan</option>
            <option>Himachal Pradesh</option>
        </select>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option selected>Mathura</option>
            <option>Agra</option>
            <option>Jaipur</option>
        </select>
        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option selected>Taj Mahal</option>
            <option>Prem Mandir</option>
            <option>Hawa Mahal</option>
        </select>
        <br><br>

        <input type="submit" value="Submit Choices">
    </form>

    <p>My selected preferences are: Country — India; State — Uttar Pradesh; City — Mathura; Favorite Tourist Place — Taj Mahal.</p>
</body>
</html>
